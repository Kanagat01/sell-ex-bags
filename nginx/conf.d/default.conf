# ==================== Блокировка чужих доменов ====================
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /certificate/fullchain.pem;
    ssl_certificate_key /certificate/privkey.pem;

    return 444;
}

# ==================== Redirect HTTP -> HTTPS ====================
server {
    listen 80;
    server_name sell.ex-bags.ru backend.sell.ex-bags.ru;

    access_log /var/log/nginx/access.log combined if=$log_success;
    access_log /var/log/nginx/errors.log combined if=$log_error;

    return 301 https://$host$request_uri;
}

# ==================== Frontend (Next.js) ====================
server {
    listen 443 ssl;
    server_name sell.ex-bags.ru www.sell.ex-bags.ru;

    ssl_certificate /certificate/fullchain.pem;
    ssl_certificate_key /certificate/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    keepalive_timeout 10s;
    keepalive_requests 100;

    access_log /var/log/nginx/access.log combined if=$log_success;
    access_log /var/log/nginx/errors.log combined if=$log_error;
    error_log /var/log/nginx/nginx_errors.log info;

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_connect_timeout 75s;
    }
}

# ==================== Backend (Django + Gunicorn) ====================
server {
    listen 443 ssl;
    server_name backend.sell.ex-bags.ru;

    client_max_body_size 0;

    ssl_certificate /certificate/fullchain.pem;
    ssl_certificate_key /certificate/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    keepalive_timeout 10s;
    keepalive_requests 100;

    access_log /var/log/nginx/access.log combined if=$log_success;
    access_log /var/log/nginx/errors.log combined if=$log_error;
    error_log /var/log/nginx/nginx_errors.log info;

    # Static файлы Django
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Media файлы
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 75s;
    }
}