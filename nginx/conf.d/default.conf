# ==================== Upstream'ы ====================
upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $status $log_success {
    ~^[45] 0;
    default 1;
}

map $status $log_error {
    ~^[45] 1;
    default 0;
}

